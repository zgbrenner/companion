name: Run final account cleanup

on:
  push:
    branches:
      - remove-hardcoded-org-cap

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-hardcoded-org-cap
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected text not found: {label}")
              return text.replace(old, new, 1)

          p = Path('src/native-usage.js')
          s = p.read_text()
          s = one(s,
            '''// The browser attaches the session cookie automatically because these requests
// originate from a content script running on a claude.ai page with host
// permission for claude.ai. This code never reads or stores the cookie itself.''',
            '''// The browser attaches the authenticated Claude session automatically because
// these requests originate from a content script on claude.ai. The extension
// reads only the non-authentication `lastActiveOrg` organization identifier; it
// never reads, stores, or transmits the authentication/session cookie.''',
            'cookie privacy comment')

          match = re.search(r'  async function getCachedAccountConfig\(\) \{.*?\n  \}\n\n  // claude\.ai stores', s, re.S)
          if not match:
              raise SystemExit('cached account getter not found')
          replacement = '''  async function getCachedAccountConfig() {
    try {
      const stored = await chrome.storage.local.get([CACHE_KEY, ACCOUNT_CACHE_KEY]);
      const org = stored[CACHE_KEY] || null;
      const account = stored[ACCOUNT_CACHE_KEY] || null;
      const now = Date.now();
      const orgFresh = Boolean(org?.orgId) && now - (org.cachedAt || 0) <= ORG_CACHE_TTL_MS;
      const accountFresh = Boolean(account?.orgId) && now - (account.cachedAt || 0) <= ORG_CACHE_TTL_MS;
      const orgId = orgFresh ? org.orgId : (accountFresh ? account.orgId : null);
      const capMatchesOrg = accountFresh && account.orgId === orgId;
      return {
        orgId,
        limitUsd: capMatchesOrg && Number.isFinite(Number(account.limitUsd)) ? Number(account.limitUsd) : null,
        currency: capMatchesOrg && account.currency ? account.currency : "USD",
        cachedAt: capMatchesOrg ? account.cachedAt : (orgFresh ? org.cachedAt : null)
      };
    } catch {
      return { orgId: null, limitUsd: null, currency: "USD", cachedAt: null };
    }
  }

  // claude.ai stores'''
          s = s[:match.start()] + replacement + s[match.end():]
          s = one(s,
            '''  // maintained open-source claude.ai extensions. The cookie value is used
  // only to pick which usage endpoint to read; it is never stored or sent
  // anywhere.''',
            '''  // maintained open-source claude.ai extensions. Only the organization UUID is
  // cached locally for 24 hours so repeated lookups do not require another org-list
  // request; it is never sent anywhere other than Claude's own usage endpoints.''',
            'organization cache comment')
          s = one(s,
            '''      // A 403 usually means the configured/cached org id doesn't match the
      // signed-in account (e.g. a contractor outside the Vistage org, or a
      // stale cache after switching accounts) — NOT that the user is signed
      // out. Retry once with live discovery (cookie/org list), bypassing the
      // configured value, before giving up.''',
            '''      // A 403 usually means the cached/detected organization no longer matches
      // the signed-in account (for example, after switching accounts) — not that
      // the user is signed out. Clear local detection state and retry once from
      // the live cookie or organization list before giving up.''',
            '403 rediscovery comment')
          s = one(s,
            '''    // 403 is "signed in, but this org isn't yours" — telling the user to
    // sign in (as the old combined mapping did) sends them in a re-login
    // loop when the real fix is the Organization ID setting.''',
            '''    // 403 is "signed in, but this organization is unavailable." Keep it
    // distinct from 401 so callers can clear detection state and retry rather
    // than sending the user through an unnecessary sign-in loop.''',
            '403 fetch comment')
          p.write_text(s)

          p = Path('src/options.js')
          s = p.read_text()
          s = s.replace('? `${CUC.formatUsd(detected.limitUsd)} (${detected.currency || "USD"})`', '? `${CUC.formatUsd(detected.limitUsd)} ${detected.currency || "USD"}`')
          s = one(s,
            '''  const settings = { ...CUC.DEFAULT_SETTINGS, ...(stored["cuc:settings"] || {}) };

  for (const field of fields) {''',
            '''  let settings = { ...CUC.DEFAULT_SETTINGS, ...(stored["cuc:settings"] || {}) };
  if ("organizationId" in settings || "enterpriseMonthlyLimitUsd" in settings) {
    const { organizationId: _legacyOrg, enterpriseMonthlyLimitUsd: _legacyCap, ...cleaned } = settings;
    settings = cleaned;
    await chrome.storage.local.set({ "cuc:settings": settings });
  }

  for (const field of fields) {''',
            'settings migration')
          s = one(s,
            '''  }
  return settings;
}''',
            '''  }
  delete settings.organizationId;
  delete settings.enterpriseMonthlyLimitUsd;
  return settings;
}''',
            'strip legacy settings')
          p.write_text(s)

          p = Path('src/background.js')
          s = p.read_text()
          s = one(s,
            '''  const existing = await chrome.storage.local.get(["cuc:settings"]);
  if (!existing["cuc:settings"] && CUC?.DEFAULT_SETTINGS) {
    await chrome.storage.local.set({ "cuc:settings": CUC.DEFAULT_SETTINGS });
  }''',
            '''  const existing = await chrome.storage.local.get(["cuc:settings"]);
  const currentSettings = existing["cuc:settings"];
  if (!currentSettings && CUC?.DEFAULT_SETTINGS) {
    await chrome.storage.local.set({ "cuc:settings": CUC.DEFAULT_SETTINGS });
  } else if (currentSettings && ("organizationId" in currentSettings || "enterpriseMonthlyLimitUsd" in currentSettings)) {
    const { organizationId: _legacyOrg, enterpriseMonthlyLimitUsd: _legacyCap, ...cleaned } = currentSettings;
    await chrome.storage.local.set({ "cuc:settings": cleaned });
  }''',
            'install migration')
          p.write_text(s)

          for filename in ('src/content.js', 'src/popup.js'):
              p = Path(filename)
              s = p.read_text().replace(
                "The configured Organization ID doesn't match this account — check Settings, or clear it to auto-detect.",
                "Claude rejected the detected organization — clear the detected account cache and refresh Claude."
              )
              p.write_text(s)

          combined = '\n'.join(Path(x).read_text() for x in [
            'src/shared.js', 'src/native-usage.js', 'src/options.js', 'src/options.html',
            'src/background.js', 'src/content.js', 'src/popup.js'])
          if '1e16048b-a724-40fd-b78b-bcf3c7f9af9a' in combined:
              raise SystemExit('hardcoded UUID remains')
          if re.search(r'organizationId\s*:', Path('src/shared.js').read_text()):
              raise SystemExit('organization default remains')
          if re.search(r'enterpriseMonthlyLimitUsd\s*:', Path('src/shared.js').read_text()):
              raise SystemExit('cap default remains')
          PY

      - name: Validate and rebuild
        run: |
          node --check src/shared.js
          node --check src/native-usage.js
          node --check src/options.js
          node --check src/background.js
          node --check src/content.js
          node --check src/popup.js
          node tools/build-update-manifest.mjs

      - name: Replace branch with one clean commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md manifest.json src update/manifest.json
          git commit -m "Finalize automatic organization and cap detection"
          PATCH_COMMIT=$(git rev-parse HEAD)
          git checkout -B clean-review origin/main
          git checkout "$PATCH_COMMIT" -- README.md manifest.json src/background.js src/content.js src/native-usage.js src/options.html src/options.js src/popup.js src/shared.js update/manifest.json
          git add README.md manifest.json src update/manifest.json
          git commit -m "Remove hardcoded organization and cap defaults"
          git push --force origin HEAD:remove-hardcoded-org-cap
