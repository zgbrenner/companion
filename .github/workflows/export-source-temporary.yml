name: export-source-temporary

on:
  workflow_dispatch:
  push:
    branches:
      - feat/lifejacket-mode
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lifejacket-mode
      - uses: actions/upload-artifact@v4
        with:
          name: companion-lifejacket-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
