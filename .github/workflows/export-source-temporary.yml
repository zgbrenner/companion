name: probe-licensed-lifejacket-model

on:
  workflow_dispatch:
  push:
    branches:
      - feat/lifejacket-mode
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe-kompress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned export and browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "optimum-onnx[onnxruntime]==0.1.0" \
            "transformers==4.57.6" \
            "onnx==1.22.0" \
            "onnxruntime==1.22.1" \
            "huggingface_hub==0.36.0"
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          npm install --no-save "@huggingface/transformers@4.2.0"

      - name: Export, quantize, inspect, and validate Kompress-Small
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee kompress-python.log
          import hashlib
          import json
          import pathlib

          import numpy as np
          import onnx
          import onnxruntime as ort
          from huggingface_hub import HfApi
          from onnxruntime.quantization import QuantType, quantize_dynamic
          from optimum.exporters.onnx import main_export
          from transformers import AutoTokenizer

          REPO = "chopratejas/kompress-small"
          REVISION = "eacbdc589d039a1a39f76a92844979ad4e266bcd"
          ROOT = pathlib.Path("probe-model")
          ROOT.mkdir(exist_ok=True)

          main_export(
              model_name_or_path=REPO,
              output=ROOT,
              task="token-classification",
              revision=REVISION,
              device="cpu",
              dtype="fp32",
              framework="pt",
              monolith=True,
              no_post_process=True,
              do_validation=True,
              trust_remote_code=False,
              library_name="transformers",
          )

          candidates = [path for path in ROOT.rglob("*.onnx") if "quant" not in path.name]
          if len(candidates) != 1:
              raise SystemExit(f"expected one exported ONNX graph, found: {candidates}")
          source = candidates[0]
          onnx_dir = ROOT / "onnx"
          onnx_dir.mkdir(exist_ok=True)
          target = onnx_dir / "model_quantized.onnx"

          quantize_dynamic(
              model_input=str(source),
              model_output=str(target),
              per_channel=True,
              reduce_range=False,
              weight_type=QuantType.QInt8,
              use_external_data_format=False,
              extra_options={"WeightSymmetric": True},
          )

          if source.parent != onnx_dir:
              source.unlink()

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          graph = onnx.load(str(target), load_external_data=True)
          onnx.checker.check_model(graph)
          session = ort.InferenceSession(str(target), providers=["CPUExecutionProvider"])
          tokenizer = AutoTokenizer.from_pretrained(str(ROOT), local_files_only=True)
          sample = (
              "Please summarize the project plan while preserving Alice, Bob, invoice 42, "
              "the June 15 deadline, and every required caveat, but remove repeated polite filler."
          )
          encoded = tokenizer(sample, return_tensors="np")
          feeds = {
              item.name: encoded[item.name].astype(np.int64)
              for item in session.get_inputs()
              if item.name in encoded
          }
          outputs = session.run(None, feeds)
          if not outputs or np.asarray(outputs[0]).shape[-1] != 2:
              raise SystemExit(f"unexpected logits shape: {[np.asarray(value).shape for value in outputs]}")

          info = HfApi().model_info(REPO, revision=REVISION, files_metadata=True)
          report = {
              "repo": REPO,
              "revision": REVISION,
              "license": (info.card_data or {}).get("license") if info.card_data else None,
              "pipeline_tag": info.pipeline_tag,
              "quantized": {
                  "path": str(target),
                  "size": target.stat().st_size,
                  "sha256": sha256(target),
              },
              "graph": {
                  "inputs": [item.name for item in session.get_inputs()],
                  "outputs": [item.name for item in session.get_outputs()],
                  "opset": max((item.version for item in graph.opset_import), default=None),
                  "output_shapes": [list(np.asarray(value).shape) for value in outputs],
              },
              "files": [
                  {
                      "path": str(path.relative_to(ROOT)),
                      "size": path.stat().st_size,
                      "sha256": sha256(path),
                  }
                  for path in sorted(ROOT.rglob("*"))
                  if path.is_file()
              ],
          }
          if report["license"] != "apache-2.0":
              raise SystemExit(f"unexpected model license: {report['license']}")
          pathlib.Path("kompress-probe.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          PY

      - name: Load the exact q8 graph with Transformers.js WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          cat > kompress-smoke.mjs <<'JS'
          import path from "node:path";
          import {
            AutoModelForTokenClassification,
            AutoTokenizer,
            env,
          } from "./node_modules/@huggingface/transformers/dist/transformers.web.js";

          env.allowRemoteModels = false;
          env.allowLocalModels = true;
          env.useBrowserCache = false;
          env.localModelPath = `${path.resolve(".")}/`;
          env.backends.onnx.wasm.wasmPaths = `${path.resolve("node_modules/onnxruntime-web/dist")}/`;
          env.backends.onnx.wasm.numThreads = 1;

          const tokenizer = await AutoTokenizer.from_pretrained("probe-model");
          const model = await AutoModelForTokenClassification.from_pretrained("probe-model", {
            dtype: "q8",
            device: "wasm",
          });
          const input = await tokenizer(
            "Keep Alice, Bob, invoice 42, and the June 15 deadline; remove repeated filler."
          );
          const output = await model(input);
          const dims = output.logits.dims;
          if (!Array.isArray(dims) || dims.at(-1) !== 2) {
            throw new Error(`unexpected logits shape: ${dims}`);
          }
          console.log(JSON.stringify({ dims, dtype: output.logits.type }));
          JS
          node kompress-smoke.mjs 2>&1 | tee kompress-js.log

      - name: Upload authoritative probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kompress-browser-probe
          path: |
            kompress-probe.json
            kompress-python.log
            kompress-js.log
          if-no-files-found: warn
          retention-days: 3
