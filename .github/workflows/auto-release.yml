name: auto-release

# Continuous delivery to the Chrome Web Store.
#
# Every push to main re-reads manifest.json. When the version has been bumped
# to one that has not shipped yet, this workflow:
#   1. verifies the matching RELEASE_NOTES_<version>.md exists;
#   2. creates (or, for a failed prior attempt, re-points) the v<version> tag;
#   3. runs the full release-package pipeline — build, test, model gates,
#      SBOM, provenance attestation, GitHub release, and Chrome Web Store
#      upload + publish.
#
# Pushes that do not change the manifest version are ignored, matching the
# Chrome Web Store rule that every uploaded package must carry a new version.
#
# Publishing to the store additionally requires:
#   - repository variable AUTO_PUBLISH_CHROME_WEB_STORE = true
#   - secrets CHROME_WEB_STORE_SERVICE_ACCOUNT_JSON,
#     CHROME_WEB_STORE_PUBLISHER_ID, CHROME_WEB_STORE_EXTENSION_ID
# See docs/RELEASING.md for one-time setup.

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  detect:
    name: Detect unreleased manifest version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare manifest version against shipped releases
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Manifest version '$version' is not a valid extension version" >&2
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to ship." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! test -s "RELEASE_NOTES_${version}.md"; then
            echo "Version $version is unreleased but RELEASE_NOTES_${version}.md is missing." >&2
            echo "Add release notes for $version and push again." >&2
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Create or re-point release tag
        if: steps.decide.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A tag without a published release is a failed prior attempt:
          # re-point it at the fixed commit so the release can be retried
          # without another version bump.
          git tag --force --annotate "$tag" -m "COMPANION ${VERSION}" "$GITHUB_SHA"
          git push --force origin "refs/tags/${tag}"
          echo "Tagged $GITHUB_SHA as $tag; starting release pipeline." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release and publish
    needs: detect
    if: needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/release-package.yml
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write
