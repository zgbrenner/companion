name: apply-orbit-brand

on:
  push:
    branches: [agent/orbit-c-brand-refresh]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbit-c-brand-refresh
      - name: Apply approved brand system
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')

          # The product name is always all caps in user-facing and test copy.
          for base in [Path('src'), Path('docs'), Path('tests')]:
              for path in base.rglob('*'):
                  if not path.is_file() or path.suffix not in {'.html', '.css', '.js', '.mjs', '.md', '.json'}:
                      continue
                  if path.as_posix() == 'tests/17-brand-identity.mjs':
                      continue
                  text = path.read_text()
                  next_text = re.sub(r'\bCompanion\b', 'COMPANION', text)
                  if next_text != text:
                      path.write_text(next_text)

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['name'] = 'COMPANION'
          manifest['description'] = 'COMPANION is a private, local usage and efficiency layer for Claude and ChatGPT, including Work and Codex-aware web surfaces.'
          manifest['action']['default_title'] = 'COMPANION'

          for entry in manifest['content_scripts']:
              if entry.get('world') == 'MAIN':
                  continue
              matches = ' '.join(entry.get('matches', []))
              if 'claude.ai' in matches or 'chatgpt.com' in matches or 'chat.openai.com' in matches:
                  css = entry.setdefault('css', [])
                  if 'src/brand-fonts.css' not in css:
                      css.insert(0, 'src/brand-fonts.css')

          brand_resources = [
              'src/fonts/league-spartan-bold.woff2',
              'src/fonts/atkinson-hyperlegible-next-variable.woff2',
          ]
          for entry in manifest['web_accessible_resources']:
              resources = [item for item in entry.get('resources', []) if item != 'src/fonts/space-grotesk-latin.woff2']
              for resource in brand_resources:
                  if resource not in resources:
                      resources.append(resource)
              entry['resources'] = resources
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          font_faces = '''/* Bundled, privacy-first typography. No runtime network requests. */
          @font-face {
            font-family: "League Spartan";
            src: url("fonts/league-spartan-bold.woff2") format("woff2");
            font-style: normal;
            font-weight: 700;
            font-display: swap;
          }

          @font-face {
            font-family: "Atkinson Hyperlegible Next";
            src: url("fonts/atkinson-hyperlegible-next-variable.woff2") format("woff2");
            font-style: normal;
            font-weight: 200 800;
            font-display: swap;
          }

          :root {
            --companion-font-brand: "League Spartan", ui-sans-serif, system-ui, sans-serif;
            --companion-font-ui: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif;
          }
          '''
          Path('src/fonts.css').write_text(font_faces)
          Path('src/brand-fonts.css').write_text(font_faces)

          # Keep the existing host-page registration path local, but point its
          # display face at the approved League Spartan binary.
          for filename in ['src/content.js', 'src/openai-content.js']:
              path = Path(filename)
              text = path.read_text()
              text = text.replace('Space Grotesk', 'League Spartan')
              text = text.replace('space-grotesk-latin.woff2', 'league-spartan-bold.woff2')
              path.write_text(text)

          # Brand marks on extension-owned pages.
          replacements = {
              'src/popup.html': [
                  ('<header>\n      <h1>COMPANION</h1>\n    </header>', '<header class="brand-header">\n      <img class="brand-mark" src="../icons/orbit-c.svg" alt="" aria-hidden="true" />\n      <h1>COMPANION</h1>\n    </header>'),
              ],
              'src/popup-router.html': [
                  ('<title>COMPANION</title>', '<title>COMPANION</title>\n  <link rel="stylesheet" href="fonts.css" />'),
                  ('<div class="loading"><span class="dot" aria-hidden="true"></span><span>Opening COMPANION…</span></div>', '<div class="loading"><img class="brand-mark" src="../icons/orbit-c.svg" alt="" aria-hidden="true" /><span>Opening COMPANION…</span></div>'),
              ],
              'src/openai-popup.html': [
                  ('<span class="mark" aria-hidden="true">◆</span>', '<img class="mark" src="../icons/orbit-c.svg" alt="" aria-hidden="true" />'),
              ],
              'src/options.html': [
                  ('<span class="brand-mark" aria-hidden="true">◆</span>', '<img class="brand-mark" src="../icons/orbit-c.svg" alt="" aria-hidden="true" />'),
              ],
          }
          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'missing expected markup in {filename}: {old[:40]}')
                  text = text.replace(old, new, 1)
              path.write_text(text)

          # Remove the former display font from all runtime styles, then append
          # a compact design layer so existing behavior and accessibility rules
          # stay intact.
          css_files = [
              'src/popup.css',
              'src/openai-popup.css',
              'src/options.css',
              'src/widget.css',
              'src/openai-widget.css',
          ]
          for filename in css_files:
              path = Path(filename)
              text = path.read_text().replace('"Space Grotesk"', '"League Spartan"')
              path.write_text(text)

          popup_override = r'''

          /* ---- Orbit C brand system ---- */
          body {
            width: 320px;
            font-family: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif;
            color: #111827;
            background: #f8fafc;
          }
          .popup { padding: 16px; }
          .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 13px;
            border-bottom: 1px solid #dbe3ec;
          }
          .brand-mark { width: 30px; height: 30px; border-radius: 8px; }
          h1 {
            font-family: "League Spartan", ui-sans-serif, system-ui, sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .12em;
            color: #111827;
          }
          .bar > div, .trend .trend-bar.today { background: #24b88e; }
          .trend .trend-bar { background: #c9f2e5; }
          button {
            font-family: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif;
            border-color: #cbd5e1;
            color: #111827;
            background: #ffffff;
          }
          button:hover { background: #eefbf7; border-color: #35d6a6; }
          button:focus-visible, .trend .trend-bar:focus-visible { outline-color: #168363; }
          @media (prefers-color-scheme: dark) {
            body { color: #f8fafc; background: #0b1220; }
            .brand-header { border-bottom-color: #334155; }
            h1 { color: #f8fafc; }
            .bar { background: #334155; }
            .bar > div, .trend .trend-bar.today { background: #35d6a6; }
            .trend .trend-bar { background: #275a4d; }
            button { color: #f8fafc; background: #172033; border-color: #334155; }
            button:hover { background: #1d2a3e; }
          }
          '''

          options_override = r'''

          /* ---- Orbit C brand system ---- */
          :root {
            --bg: #f1f5f9;
            --surface: #ffffff;
            --surface-muted: #f8fafc;
            --surface-sunken: #e8eef5;
            --border: #d7e0ea;
            --border-strong: #b8c5d4;
            --text: #111827;
            --text-strong: #111827;
            --muted: #526174;
            --muted-2: #334155;
            --accent: #168363;
            --accent-soft: rgba(53, 214, 166, .14);
            --shadow: 0 8px 28px rgba(15, 23, 42, .07);
          }
          body { font-family: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif; }
          .brand { align-items: center; gap: 10px; }
          .brand-mark { width: 30px; height: 30px; border-radius: 8px; }
          .brand-name {
            font-family: "League Spartan", ui-sans-serif, system-ui, sans-serif;
            font-size: 16px;
            letter-spacing: .12em;
          }
          .card-header h2, .metrics-group-legend {
            font-family: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 0;
          }
          .topbar { background: color-mix(in srgb, #f1f5f9 88%, transparent); }
          .section-nav a.active { color: #0f6d52; }
          @media (prefers-color-scheme: dark) {
            :root {
              --bg: #0b1220;
              --surface: #111827;
              --surface-muted: #172033;
              --surface-sunken: #0f172a;
              --border: #334155;
              --border-strong: #475569;
              --text: #e6edf5;
              --text-strong: #f8fafc;
              --muted: #a9b6c6;
              --muted-2: #cbd5e1;
              --accent: #35d6a6;
              --accent-soft: rgba(53, 214, 166, .14);
            }
            .topbar { background: color-mix(in srgb, #0b1220 88%, transparent); }
          }
          '''

          openai_popup_override = r'''

          /* ---- Orbit C brand system ---- */
          body {
            font-family: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif;
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-hover: #eefbf7;
            --border: rgba(51, 65, 85, .18);
            --text: #111827;
            --muted: #526174;
            --accent: #168363;
            --accent-soft: rgba(53, 214, 166, .14);
            --accent-strong: #0f6d52;
          }
          .mark { width: 30px; height: 30px; border-radius: 8px; }
          h1 {
            font-family: "League Spartan", ui-sans-serif, system-ui, sans-serif;
            letter-spacing: .12em;
          }
          h2, .value { font-family: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif; }
          @media (prefers-color-scheme: dark) {
            body {
              --bg: #0b1220;
              --surface: #172033;
              --surface-hover: #1d2a3e;
              --border: rgba(203, 213, 225, .18);
              --text: #f8fafc;
              --muted: #a9b6c6;
              --accent: #35d6a6;
              --accent-soft: rgba(53, 214, 166, .14);
              --accent-strong: #7ce7cd;
            }
          }
          '''

          widget_override = r'''

          /* ---- Orbit C brand system ---- */
          .cuc-root { font-family: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif; color: #111827; }
          .cuc-card { border-color: #d7e0ea; box-shadow: 0 8px 28px rgba(15, 23, 42, .08); }
          .cuc-header { background: #f8fafc; border-bottom-color: #d7e0ea; }
          .cuc-title {
            font-family: "League Spartan", ui-sans-serif, system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
          }
          .cuc-meter-label span:last-child, .cuc-native-label span:last-child {
            font-family: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif;
          }
          .cuc-progress-bar { background: #24b88e; }
          .cuc-button:focus-visible, .cuc-switch:focus-visible, .cuc-dropzone:focus-visible { outline-color: #168363; }
          :host(.cuc-dark) .cuc-root { color: #f8fafc; }
          :host(.cuc-dark) .cuc-card { background: #111827; border-color: #334155; }
          :host(.cuc-dark) .cuc-header { background: #172033; border-bottom-color: #334155; }
          :host(.cuc-dark) .cuc-title { color: #f8fafc; }
          :host(.cuc-dark) .cuc-progress-bar { background: #35d6a6; }
          '''

          openai_widget_override = r'''

          /* ---- Orbit C brand system ---- */
          :host {
            --cuc-bg: rgba(248, 250, 252, .96);
            --cuc-bg-soft: #ffffff;
            --cuc-bg-hover: #eefbf7;
            --cuc-border: rgba(51, 65, 85, .18);
            --cuc-text: #111827;
            --cuc-muted: #526174;
            --cuc-accent: #24b88e;
            --cuc-accent-soft: rgba(53, 214, 166, .14);
            --cuc-accent-strong: #0f6d52;
            font-family: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif;
          }
          :host(.cuc-openai-dark) {
            --cuc-bg: rgba(11, 18, 32, .97);
            --cuc-bg-soft: #172033;
            --cuc-bg-hover: #1d2a3e;
            --cuc-border: rgba(203, 213, 225, .18);
            --cuc-text: #f8fafc;
            --cuc-muted: #a9b6c6;
            --cuc-accent: #35d6a6;
            --cuc-accent-soft: rgba(53, 214, 166, .14);
            --cuc-accent-strong: #7ce7cd;
          }
          .cuc-openai-title {
            font-family: "League Spartan", ui-sans-serif, system-ui, sans-serif;
            letter-spacing: .12em;
            text-transform: uppercase;
          }
          .cuc-openai-mark {
            position: relative;
            overflow: hidden;
            border-radius: 7px;
            background: #111827;
            color: transparent;
            font-size: 0;
          }
          .cuc-openai-mark::before {
            content: "";
            position: absolute;
            inset: 4px;
            border: 2px solid #f8fafc;
            border-right-color: transparent;
            border-radius: 50%;
            transform: rotate(-18deg);
          }
          .cuc-openai-mark::after {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #35d6a6;
            box-shadow: 7px 5px 0 -1px #35d6a6;
          }
          .cuc-openai-value, .cuc-openai-dialog h2 { font-family: "Atkinson Hyperlegible Next", ui-sans-serif, system-ui, sans-serif; }
          '''

          overrides = {
              'src/popup.css': popup_override,
              'src/options.css': options_override,
              'src/openai-popup.css': openai_popup_override,
              'src/widget.css': widget_override,
              'src/openai-widget.css': openai_widget_override,
          }
          for filename, addition in overrides.items():
              path = Path(filename)
              text = path.read_text()
              if 'Orbit C brand system' not in text:
                  path.write_text(text.rstrip() + addition + '\n')

          # OpenAI popup previously declared its display face locally. Import the
          # complete bundled type system before any rules.
          openai_popup = Path('src/openai-popup.css')
          text = openai_popup.read_text()
          if not text.startswith('@import url("fonts.css");'):
              openai_popup.write_text('@import url("fonts.css");\n\n' + text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          entry = '- Introduced the Orbit C identity, all-caps COMPANION wordmark, and locally bundled League Spartan and Atkinson Hyperlegible Next typography across the toolbar, popups, settings, and provider widgets.\n'
          anchor = '### Unreleased (OpenAI hardening)\n\n'
          if entry not in text:
              text = text.replace(anchor, anchor + entry, 1)
          changelog.write_text(text)

          # Documentation follows the optimized WOFF2 filenames actually shipped.
          for filename in ['docs/ATTRIBUTIONS.md', 'docs/superpowers/plans/2026-07-21-orbit-c-brand-refresh.md']:
              path = Path(filename)
              text = path.read_text()
              text = text.replace('league-spartan-variable.ttf', 'league-spartan-bold.woff2')
              text = text.replace('atkinson-hyperlegible-next-variable.ttf', 'atkinson-hyperlegible-next-variable.woff2')
              path.write_text(text)

          old_font = Path('src/fonts/space-grotesk-latin.woff2')
          if old_font.exists():
              old_font.unlink()

          # One-time automation files never ship with the extension branch.
          for filename in [
              '.github/BRAND_REFRESH.md',
              '.github/workflows/bootstrap-brand-assets.yml',
              '.github/workflows/apply-orbit-brand.yml',
          ]:
              path = Path(filename)
              if path.exists():
                  path.unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: apply Orbit C brand system'
          git push origin HEAD:agent/orbit-c-brand-refresh
