name: generate-launch-assets

on:
  push:
    branches:
      - agent/release-growth-prep
    paths:
      - .github/workflows/generate-launch-assets.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: "1.61.1"
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-growth-prep

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium renderer
        run: |
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Render current extension surfaces
        run: node tests/18-brand-snapshots.mjs

      - name: Install image and font tooling
        run: python3 -m pip install --disable-pip-version-check pillow 'fonttools[woff]' brotli

      - name: Decompress bundled brand fonts for Pillow
        shell: bash
        run: |
          python3 - <<'PY'
          from fontTools.ttLib import TTFont
          for source, destination in (
              ('src/fonts/league-spartan-bold.woff2', '/tmp/companion-league-spartan.ttf'),
              ('src/fonts/atkinson-hyperlegible-next-variable.woff2', '/tmp/companion-atkinson.ttf'),
          ):
              font = TTFont(source)
              font.flavor = None
              font.save(destination)
          PY

      - name: Generate platform-sized launch assets
        env:
          COMPANION_BRAND_FONT: /tmp/companion-league-spartan.ttf
          COMPANION_UI_FONT: /tmp/companion-atkinson.ttf
          COMPANION_UI_BOLD_FONT: /tmp/companion-atkinson.ttf
        run: python3 tools/generate-launch-assets.py

      - name: Verify release readiness contract
        run: node tests/20-release-readiness.mjs

      - name: Commit generated assets and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            store/promo-tile-440x280.png \
            store/marquee-1400x560.png \
            store/screenshots/01-overview.png \
            store/screenshots/02-claude-usage.png \
            store/screenshots/03-chatgpt-work-codex.png \
            store/screenshots/04-settings-privacy.png \
            store/screenshots/05-local-efficiency-tools.png \
            docs/launch/assets/product-hunt-thumbnail-240x240.png \
            docs/launch/assets/product-hunt-gallery-01-1270x760.png \
            docs/launch/assets/product-hunt-gallery-02-1270x760.png \
            docs/launch/assets/product-hunt-gallery-03-1270x760.png \
            docs/launch/assets/social-card-1200x630.png
          git rm .github/workflows/generate-launch-assets.yml
          git commit -m 'assets: generate release and launch artwork'
          git push origin HEAD:agent/release-growth-prep
