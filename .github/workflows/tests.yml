name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Run extension test suite
        shell: bash
        run: |
          set +e
          node tests/run.mjs 2>&1 | tee extension-test-output.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload extension test transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-test-output
          path: extension-test-output.log
          if-no-files-found: error
          retention-days: 14
