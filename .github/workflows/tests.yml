name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: "1.61.1"
      AXE_CORE_VERSION: "4.12.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install pinned test dependencies
        run: |
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}" "axe-core@${AXE_CORE_VERSION}"
          npx playwright install --with-deps chromium
      - name: Run extension test suite
        shell: bash
        run: |
          set +e
          node tests/run.mjs 2>&1 | tee extension-test-output.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload extension test transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-test-output
          path: extension-test-output.log
          if-no-files-found: error
          retention-days: 14
      - name: Upload rendered brand snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brand-snapshots
          path: test-artifacts/brand
          if-no-files-found: warn
          retention-days: 14
