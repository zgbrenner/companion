name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 10 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze extension source
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject vulnerable or disallowed dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  dependency-audits:
    name: Locked dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lifejacket-build.txt
      - name: Audit locked npm graph
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
      - name: Audit pinned Python build tools
        run: |
          python -m pip install --disable-pip-version-check "pip-audit==2.9.0"
          pip-audit --requirement requirements-lifejacket-build.txt --progress-spinner off

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history and proposed changes
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-surface:
    name: Extension package policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build release surface without browser tests
        id: build
        uses: ./.github/actions/build-extension
        with:
          run-tests: "false"
          build-package: "true"
          install-chromium: "false"
      - name: Inspect package for forbidden executable surfaces
        shell: bash
        run: |
          set -euo pipefail
          package="${{ steps.build.outputs.zip_path }}"
          unzip -l "$package" > package-files.txt
          if unzip -Z1 "$package" | grep -E '\.(exe|dll|dylib|so|node|pem|key|p12|pfx|map)$'; then
            echo "Forbidden release file detected" >&2
            exit 1
          fi
          if unzip -p "$package" manifest.json | grep -q '<all_urls>'; then
            echo "Broad host access is forbidden" >&2
            exit 1
          fi
          extension_csp="$(unzip -p "$package" manifest.json | python3 -c 'import json, sys; print(json.load(sys.stdin)["content_security_policy"]["extension_pages"])')"
          if grep -Eq "(^|[;[:space:]])'unsafe-eval'([;[:space:]]|$)" <<<"$extension_csp"; then
            echo "the broad unsafe-eval CSP token is forbidden on extension pages" >&2
            exit 1
          fi
      - name: Upload audited package inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-package-inventory-${{ github.run_id }}
          path: |
            package-files.txt
            dist/companion-*-inventory.json
            dist/lifejacket-assets.json
          if-no-files-found: warn
          retention-days: 14
