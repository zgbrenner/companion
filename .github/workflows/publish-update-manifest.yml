# Regenerates update/manifest.json (version + SHA-256 file hashes) whenever
# shipped extension files change on main. The in-extension self-updater reads
# this manifest from raw.githubusercontent.com / jsDelivr to detect and
# install updates. The paths filter keeps this workflow from re-triggering on
# its own commit (which only touches update/).
name: Publish update manifest

on:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "src/**"
      - "icons/**"
      - "tools/build-update-manifest.mjs"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (and sign, if the key secret is set) the update manifest
        env:
          # Store the ECDSA P-256 private key (base64 PKCS8 from
          # tools/gen-signing-key.mjs) as this repo secret to sign releases.
          # Absent → manifest ships unsigned (clients with a public key baked
          # in will then refuse the update — fail closed).
          CUC_UPDATE_SIGNING_KEY: ${{ secrets.CUC_UPDATE_SIGNING_KEY }}
        run: node tools/build-update-manifest.mjs
      - name: Commit manifest if changed
        run: |
          if [ -n "$(git status --porcelain update/manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898084+github-actions[bot]@users.noreply.github.com"
            git add update/manifest.json
            git commit -m "chore: publish update manifest for v$(node -p "require('./manifest.json').version")"
            git push
          else
            echo "update/manifest.json unchanged"
          fi
