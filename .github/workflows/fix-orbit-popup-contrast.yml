name: fix-orbit-popup-contrast

on:
  push:
    branches: [agent/orbit-c-brand-refresh]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbit-c-brand-refresh
      - name: Apply focused popup contrast fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/popup.css')
          css = path.read_text()
          marker = '/* Orbit C popup note contrast */'
          if marker not in css:
              css = css.rstrip() + '''

          /* Orbit C popup note contrast */
          .budget-line, .native-note { color: #526174; }
          @media (prefers-color-scheme: dark) {
            .budget-line, .native-note { color: #a9b6c6; }
          }
          ''' + '\n'
          path.write_text(css)
          Path('.github/workflows/fix-orbit-popup-contrast.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: preserve popup note contrast'
          git push origin HEAD:agent/orbit-c-brand-refresh
