name: finalize-orbit-ui

on:
  push:
    branches: [agent/orbit-c-brand-refresh]
    paths:
      - .github/workflows/finalize-orbit-ui.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbit-c-brand-refresh
      - name: Normalize typography and widget identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          brand_rules = {
              'src/popup.css': ('.brand-header h1', ''),
              'src/openai-popup.css': ('.brand h1', ''),
              'src/options.css': ('.brand-name', ''),
              'src/widget.css': (
                  '.cuc-title',
                  '''
          .cuc-brand { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
          .cuc-orbit-mark { width: 20px; height: 20px; flex: 0 0 auto; display: inline-grid; }
          .cuc-orbit-mark svg { display: block; width: 100%; height: 100%; }
          '''
              ),
              'src/openai-widget.css': (
                  '.cuc-openai-title',
                  '''
          .cuc-openai-mark { width: 22px; height: 22px; padding: 0; border-radius: 7px; overflow: hidden; background: transparent; color: inherit; }
          .cuc-openai-mark svg { display: block; width: 100%; height: 100%; }
          '''
              ),
          }

          for filename, (selector, extra) in brand_rules.items():
              path = Path(filename)
              text = path.read_text()
              text = text.replace('"League Spartan"', '"Atkinson Hyperlegible Next"')
              marker = '/* Brand-only display type */'
              if marker in text:
                  text = text.split(marker, 1)[0].rstrip() + '\n'
              text += f'''\n\n{marker}\n{selector} {{\n  font-family: "League Spartan", ui-sans-serif, system-ui, sans-serif;\n}}\n'''
              if extra:
                  text += extra.strip() + '\n'
              path.write_text(text)

          orbit_svg = '''<svg viewBox="0 0 128 128" focusable="false" aria-hidden="true"><rect width="128" height="128" rx="28" fill="#111827"></rect><path d="M91.4 35.8A42 42 0 1 0 94.6 88" fill="none" stroke="#F8FAFC" stroke-width="11" stroke-linecap="round"></path><circle cx="64" cy="64" r="15" fill="#35D6A6"></circle><circle cx="94.6" cy="88" r="5.5" fill="#35D6A6"></circle></svg>'''

          claude = Path('src/content.js')
          text = claude.read_text()
          old = '''        <div class="cuc-header">\n          <span class="cuc-title">COMPANION</span>'''
          new = f'''        <div class="cuc-header">\n          <div class="cuc-brand"><span class="cuc-orbit-mark" aria-hidden="true">{orbit_svg}</span><span class="cuc-title">COMPANION</span></div>'''
          if old not in text:
              raise SystemExit('Claude widget brand header pattern not found')
          claude.write_text(text.replace(old, new, 1))

          openai = Path('src/openai-content.js')
          text = openai.read_text()
          old = '<span class="cuc-openai-mark" aria-hidden="true">◆</span>'
          new = f'<span class="cuc-openai-mark" aria-hidden="true">{orbit_svg}</span>'
          if old not in text:
              raise SystemExit('OpenAI widget placeholder mark not found')
          openai.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/finalize-orbit-ui.yml
      - name: Commit normalized identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/popup.css src/openai-popup.css src/options.css src/widget.css src/openai-widget.css src/content.js src/openai-content.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: reserve display type for COMPANION wordmarks'
          git push origin HEAD:agent/orbit-c-brand-refresh
