name: bootstrap-brand-fonts

on:
  push:
    branches: [agent/orbit-c-brand-refresh]
    paths:
      - .github/workflows/bootstrap-brand-fonts.yml

permissions:
  contents: write

jobs:
  bundle-fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbit-c-brand-refresh
      - name: Download OFL variable fonts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/fonts
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/leaguespartan/LeagueSpartan%5Bwght%5D.ttf' \
            --output src/fonts/league-spartan-variable.ttf
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/google/fonts/main/ofl/atkinsonhyperlegiblenext/AtkinsonHyperlegibleNext%5Bwght%5D.ttf' \
            --output src/fonts/atkinson-hyperlegible-next-variable.ttf
          test "$(stat -c%s src/fonts/league-spartan-variable.ttf)" -gt 90000
          test "$(stat -c%s src/fonts/atkinson-hyperlegible-next-variable.ttf)" -gt 110000
          file src/fonts/*.ttf | grep -q 'TrueType Font data'
      - name: Commit bundled fonts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/fonts/league-spartan-variable.ttf src/fonts/atkinson-hyperlegible-next-variable.ttf
          git diff --cached --quiet && exit 0
          git commit -m 'chore: bundle privacy-first brand fonts'
          git push origin HEAD:agent/orbit-c-brand-refresh
