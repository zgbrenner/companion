name: finalize-brand-assets

on:
  push:
    branches: [agent/orbit-c-brand-refresh]
    paths:
      - .github/workflows/bootstrap-brand-fonts.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/orbit-c-brand-refresh
      - name: Apply final accessibility and asset cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/options.css')
          text = path.read_text()
          old = '  --accent: #168363;\n'
          new = '  --accent: #14765a;\n'
          if old not in text:
              raise SystemExit('expected light-mode Orbit accent token not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm --ignore-unmatch \
            src/fonts/league-spartan-variable.ttf \
            src/fonts/atkinson-hyperlegible-next-variable.ttf \
            .github/workflows/bootstrap-brand-fonts.yml
      - name: Commit final production asset set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/options.css
          git diff --cached --quiet && exit 0
          git commit -m 'fix: finalize accessible Orbit C assets'
          git push origin HEAD:agent/orbit-c-brand-refresh
