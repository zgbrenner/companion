name: Bug report
description: Report a reproducible COMPANION problem without sharing private account or conversation data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve COMPANION. Remove prompts, replies, account details, and confidential file content from screenshots or examples. Never post passwords, cookies, tokens, session data, raw private account responses, or full URLs containing query parameters.

  - type: dropdown
    id: provider
    attributes:
      label: Provider or surface
      options:
        - Claude.ai
        - ChatGPT Chat
        - ChatGPT Work
        - Codex-aware ChatGPT web route
        - Toolbar popup
        - Settings
        - File conversion
        - Other
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: COMPANION version
      placeholder: "1.3.0"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 140.0.0.0"
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Page appearance
      options:
        - Light
        - Dark
        - System or automatic
        - Not applicable
    validations:
      required: true

  - type: input
    id: pathname
    attributes:
      label: URL pathname only
      description: Include the pathname after the host, but remove query strings, conversation identifiers, and account identifiers.
      placeholder: "/c/... with identifiers removed"

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect COMPANION to do?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include exact visible error text when safe.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Start from a page reload or clean extension restart when possible.
      placeholder: |
        1. Open ...
        2. Reload ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized console output or screenshot
      description: Remove conversation text, account data, URLs with query strings, cookies, tokens, and confidential information.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, tokens, cookies, account identifiers, prompt and reply text, and confidential file content.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
