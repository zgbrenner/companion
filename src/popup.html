<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vistage Claude Usage Companion</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header>
      <h1>Claude Usage</h1>
      <p class="org-tag">Vistage Worldwide, Inc. — internal tool</p>
    </header>

    <section class="meter">
      <div class="meter-label"><span>Usage in this chat</span><span id="chat-value">—</span></div>
      <div class="bar" role="progressbar" aria-label="Context window used in this chat" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="chat-bar"></div></div>
      <p class="budget-line" id="chat-detail">Open a claude.ai tab to see this chat.</p>
    </section>

    <section class="summary">
      <div class="summary-row"><span>Today (estimate)</span><span id="today-value">$0.00</span></div>
      <div class="summary-row"><span>This month (estimate)</span><span id="month-value">$0.00</span></div>
    </section>

    <section class="native" id="native-section">
      <div class="native-row" id="row-five-hour" hidden>
        <div class="native-label"><span>Session limit (5-hour)</span><span id="five-hour-value">—</span></div>
        <div class="bar bar--thin" role="progressbar" aria-label="Session limit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="five-hour-bar"></div></div>
      </div>
      <div class="native-row" id="row-seven-day" hidden>
        <div class="native-label"><span>Weekly limit</span><span id="seven-day-value">—</span></div>
        <div class="bar bar--thin" role="progressbar" aria-label="Weekly limit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="seven-day-bar"></div></div>
      </div>
      <div class="native-row" id="row-opus" hidden>
        <div class="native-label"><span>Weekly Opus limit</span><span id="opus-value">—</span></div>
        <div class="bar bar--thin" role="progressbar" aria-label="Weekly Opus limit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="opus-bar"></div></div>
      </div>
      <div class="native-row" id="row-enterprise" hidden>
        <div class="native-label"><span>Monthly allowance</span><span id="enterprise-value">—</span></div>
        <div class="bar bar--thin" role="progressbar" aria-label="Monthly allowance" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="enterprise-bar"></div></div>
      </div>
      <p class="native-note" id="native-note"></p>
    </section>

    <section class="actions">
      <button id="show-widget">Show widget</button>
      <button id="reset">Reset usage estimates</button>
      <button id="settings">Settings</button>
    </section>
  </main>
  <script src="shared.js"></script>
  <script src="native-usage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
