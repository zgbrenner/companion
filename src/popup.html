<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vistage Claude Usage Companion</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header>
      <h1>Claude Companion</h1>
      <p class="org-tag">Vistage Worldwide, Inc. — internal tool</p>
    </header>

    <section class="meter">
      <div class="meter-label"><span title="Your real usage-credit spend since you opened your browser — read from Claude's own monthly counter, accurate to the cent. Covers all your Claude activity in that time (every tab and device), not just one chat.">Spent this session</span><span id="session-value">—</span></div>
      <div class="bar" role="progressbar" aria-label="Session spend as a share of the monthly allowance" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="session-bar"></div></div>
      <p class="budget-line" id="session-detail">Open a claude.ai tab to load your usage.</p>
    </section>

    <section class="summary">
      <div class="summary-row"><span title="Counter samples observed today; spend while the browser was closed lands on the first day it's seen again.">Today</span><span id="today-value">—</span></div>
      <div class="summary-row"><span title="Claude's own monthly usage-credit counter — real, to the cent.">This month</span><span id="month-value">—</span></div>
      <div class="trend" id="trend" role="img" aria-label="Daily spend, last 14 days"></div>
      <p class="trend-caption" id="trend-caption" hidden>Last 14 days · real spend</p>
    </section>

    <section class="native" id="native-section">
      <div class="native-row" id="row-five-hour" hidden>
        <div class="native-label"><span title="How much of your rolling 5-hour Claude allowance you've used. This is the limit that pauses you mid-day. Read from Claude directly — not an estimate.">Session limit (5-hour)</span><span id="five-hour-value">—</span></div>
        <div class="bar bar--thin" role="progressbar" aria-label="Session limit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="five-hour-bar"></div></div>
      </div>
      <div class="native-row" id="row-seven-day" hidden>
        <div class="native-label"><span title="Your 7-day Claude allowance across all models. Read from Claude directly — not an estimate.">Weekly limit</span><span id="seven-day-value">—</span></div>
        <div class="bar bar--thin" role="progressbar" aria-label="Weekly limit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="seven-day-bar"></div></div>
      </div>
      <div class="native-row" id="row-opus" hidden>
        <div class="native-label"><span title="Your 7-day allowance for the Opus model specifically. Only shown once you've used Opus this week.">Weekly Opus limit</span><span id="opus-value">—</span></div>
        <div class="bar bar--thin" role="progressbar" aria-label="Weekly Opus limit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="opus-bar"></div></div>
      </div>
      <div class="native-row" id="row-enterprise" hidden>
        <div class="native-label"><span title="Monthly usage-credit spend and cap from Claude.ai — real account data, not an estimate.">Monthly allowance</span><span id="enterprise-value">—</span></div>
        <div class="bar bar--thin" role="progressbar" aria-label="Monthly allowance" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="enterprise-bar"></div></div>
      </div>
      <p class="native-note" id="native-note"></p>
      <p class="native-note pace-note" id="pace-note" hidden></p>
    </section>

    <section class="actions">
      <button id="show-widget">Show widget</button>
      <button id="reset" title="Start the session counter over from $0.00 as of now">Restart session counter</button>
      <button id="settings">Settings</button>
    </section>
  </main>
  <script src="shared.js"></script>
  <script src="native-usage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
