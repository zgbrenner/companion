<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vistage Claude Usage Companion</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <header>
      <h1>Claude Usage</h1>
      <p class="org-tag">Vistage Worldwide, Inc. — internal tool</p>
    </header>

    <section class="meter">
      <div class="meter-label"><span>Usage in this chat</span><span id="chat-value">$0.00</span></div>
      <div class="bar"><div id="chat-bar"></div></div>
      <p class="budget-line" id="chat-detail">0 tokens · ballpark estimate</p>
    </section>

    <section class="native" id="native-section">
      <div class="meter-label"><span>Enterprise limit</span><span id="enterprise-value">—</span></div>
      <div class="bar"><div id="enterprise-bar"></div></div>
      <p class="native-note" id="native-note"></p>
    </section>

    <section class="meter" id="daily-section">
      <div class="meter-label"><span>Daily self-limit</span><span id="daily-value">$0.00 of $5.00</span></div>
      <div class="bar"><div id="daily-bar"></div></div>
    </section>

    <section class="actions">
      <button id="show-widget">Show widget</button>
      <button id="reset">Reset session</button>
      <button id="settings">Settings</button>
    </section>
  </main>
  <script src="shared.js"></script>
  <script src="native-usage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
