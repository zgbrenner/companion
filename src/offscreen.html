<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>COMPANION local processing services</title>
</head>
<body>
  <!-- The privileged offscreen host keeps the local quantized compressor warm
       and relays user-selected files into a separate opaque-origin sandbox.
       Neither service stores prompt or file content. -->
  <iframe id="sandbox" src="sandbox.html" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  <script src="lifejacket-core.js"></script>
  <script src="offscreen.js"></script>
  <script type="module" src="lifejacket-runtime.js"></script>
</body>
</html>
