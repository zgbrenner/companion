<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>COMPANION — file conversion service</title>
</head>
<body>
  <!-- Offscreen document: the PRIVILEGED half of file conversion. It has
       chrome.* access and extension-origin privileges, so it can talk to the
       background worker and read the bundled PDF worker file — but it does NOT
       run the third-party parser itself. It hosts a sandboxed iframe (opaque
       origin, no chrome access) and relays bytes in / Markdown out. That keeps
       any parser exploit contained to the sandbox, away from storage, the
       network, and Claude's session. -->
  <iframe id="sandbox" src="sandbox.html" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  <script src="offscreen.js"></script>
</body>
</html>
